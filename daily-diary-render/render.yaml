# Render blueprint for "Daily Diary".
# Push this folder to GitHub, then in Render choose New -> Blueprint and pick the repo.
# Render reads this file and creates the web service with the settings below.

services:
  - type: web
    name: daily-diary
    runtime: node
    plan: free
    region: oregon
    branch: main

    # Bun is available in the build because bun.lock sits in the repo root.
    # NITRO_PRESET=node-server makes the build emit a plain Node server
    # (.output/server/index.mjs) instead of a Cloudflare Worker.
    buildCommand: NITRO_PRESET=node-server bun install --frozen-lockfile && NITRO_PRESET=node-server bun run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /

    envVars:
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_VERSION
        value: "22"
      - key: BUN_VERSION
        value: "1.4.4"

      # Backend config read by the server at runtime.
      # "sync: false" means: you type the value in Render's Environment tab
      # (or edit it here before committing — it is a public, publishable key).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
